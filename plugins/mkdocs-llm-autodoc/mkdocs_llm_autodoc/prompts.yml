# DETAILED LEVEL AGENT PROMPTS
# ====================

detailed_level:
  # Class Documentation
  class_prompt: |
    Act as a Senior Software Architect and QA Lead. Analyze this C++ class to create a "Deep Atomic Intelligence Report".

    # Class Information
    **Name**: {class_name}
    **File**: {file_path}
    **Base Classes**: {', '.join(base_classes) if base_classes else 'None'}
    **Methods**: {len(methods)} methods

    ## Header Code
    ```cpp
    {header_code}
    ```

    ## Methods
    {self._format_methods(methods)}

    # Your Task
    Create a comprehensive developer-centric report. Do NOT just list methods. Analyze the code deeply.

    ## 1. Class Overview & Topics
    - **High-Level Topic**: What broad category does this fit? (e.g., "Authentication", "Data Storage")
    - **Low-Level Topics**: Specific implementation details (e.g., "AES Encryption", "File I/O")
    - **Responsibility**: What is its SINGLE primary responsibility?
    - **Relationships**: How does it fit into the larger system?

    ## 2. Visual Documentation (Mermaid)
    Create Mermaid diagrams to visualize this class.
    - **Class Diagram**: Show inheritance and key relationships.
    ```mermaid
    classDiagram
        class {class_name} {{
            +publicMethod()
            -privateMember
        }}
        %% Add relationships here
    ```
    - **State Chart** (If applicable): If the class manages state (enums, flags), show transitions.
    ```mermaid
    stateDiagram-v2
        [*] --> Idle
        Idle --> Processing : start()
        Processing --> Idle : finish()
    ```
    - **Sequence Diagram** (If applicable): If the class interacts with other components in a complex way.
    ```mermaid
    sequenceDiagram
        User->>{class_name}: callMethod()
        {class_name}->>Dependency: fetchData()
        Dependency-->>{class_name}: data
        {class_name}-->>User: result
    ```

    ## 3. Usage Examples
    Provide realistic, copy-pasteable code snippets.
    - **Instantiation**: How to create this object.
    - **Common Use Case**: How to call the main methods.
    ```cpp
    // Example
    auto obj = {class_name}();
    obj.doSomething();
    ```

    ## 4. Code Quality & Health Analysis
    Analyze the code for potential issues. Be critical.
    - **Documentation Quality**: Are comments sufficient? Are names descriptive?
    - **Implementation Gaps**: Are there TODOs, missing error handling, or incomplete logic?
    - **Complexity**: Identify "God Methods" or high cyclomatic complexity.
    - **Enhancement Proposals**: Concrete suggestions (e.g., "Extract method X", "Add null check").

    ## 5. Tester's Intelligence Report
    Crucial for QA and Unit Testing.
    - **Test Scenarios**: List specific positive and negative test cases.
    - **Edge Cases**: What happens with empty inputs, null pointers, max values?
    - **Mocking Requirements**: What external dependencies need to be mocked to test this isolated?

    ## 6. Public Interface (Detailed)
    For EACH public method:
    ### `methodName`
    - **Signature**: `ReturnType methodName(...)`
    - **Source Link**: `[View Source]({file_path})`
    - **Description**: Clear explanation.
    - **Parameters**: Details with constraints.
    - **Returns**: Meaning of values.
    - **Complexity**: Time/Space estimate.

    # Output Format
    - Use Markdown with clear headings.
    - **Embed Mermaid diagrams** directly.
    - **Use Icons** for warnings/tips.
    - **Be concise but deep**.

  # Function Documentation
  function_prompt: |
    Act as a Senior Software Architect and QA Lead. Analyze these C++ functions to create a "Deep Atomic Intelligence Report".

    # File Information
    **File**: {file_path}
    **Functions**: {len(functions)} functions

    ## Functions
    {self._format_functions_detailed(functions)}

    # Your Task
    Create a comprehensive developer-centric report.

    ## 1. File Overview & Topics
    - **High-Level Topic**: Broad category.
    - **Low-Level Topics**: Specific details.
    - **Responsibility**: Primary purpose.

    ## 2. Visual Documentation (Mermaid)
    - **Flowchart**: If logic is complex (branches/loops).
    ```mermaid
    graph TD
        Start --> Check
        Check -- Yes --> DoWork
        Check -- No --> Error
    ```

    ## 3. Usage Examples
    - **How to Call**: Realistic examples.
    ```cpp
    // Example
    auto result = functionName(args);
    ```

    ## 4. Code Quality & Health Analysis
    - **Documentation Quality**: Comments/Naming.
    - **Implementation Gaps**: TODOs, error handling.
    - **Efficiency**: O(n^2) algorithms?
    - **Enhancement Proposals**: Refactoring ideas.

    ## 5. Tester's Intelligence Report
    - **Test Scenarios**: Positive/Negative.
    - **Edge Cases**: Nulls, boundaries.
    - **Mocking Requirements**: Dependencies.

    ## 6. Functions (Detailed)
    For EACH function:
    ### `functionName`
    - **Signature**: `ReturnType functionName(...)`
    - **Source Link**: `[View Source]({file_path})`
    - **Description**: Explanation.
    - **Parameters**: Constraints.
    - **Returns**: Values.
    - **Complexity**: Time/Space.

    # Output Format
    - Markdown with clear headings.
    - **Embed Mermaid diagrams**.

