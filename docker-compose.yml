version: '3.8'

services:
  doc-gen:
    build: .
    container_name: llm-autodoc
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PROXY_TARGET_URL=${PROXY_TARGET_URL}
      - PROXY_PORT=${PROXY_PORT:-8080}
    # Keep container running if we want to exec into it, or run serve by default
    command: mkdocs serve -a 0.0.0.0:8000

  # ChromaDB for RAG (Phase 6)
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000" # Map container 8000 to host 8001 to avoid conflict
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma-data:
