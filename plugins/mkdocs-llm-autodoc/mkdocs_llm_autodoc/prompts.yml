mid_level:
  # Module Documentation
  module: |
    Create comprehensive documentation for this module.

    # Module Information
    **Name**: {module_name}
    **Files**: {module_files}
    **Classes**: {module_classes}

    # Project Context
    {project_structure}

    # Your Task
    Document this module in detail, explaining its purpose, components, and how it fits into the larger project.

    ## Topics to Cover
    1. **Module Overview**: Purpose and responsibility
    2. **Key Components**:
       - Main classes and their roles
       - Important functions
       - Data structures
    3. **Architecture**: Internal organization
    4. **Dependencies**:
       - What this module depends on
       - What depends on this module
    5. **Usage Examples**: How to use this module
    6. **API Summary**: Key public interfaces
    7. **Design Patterns**: Patterns used in this module
    8. **Best Practices**: How to work with this module

    ## Requirements
    - Reference specific classes and functions
    - Include code examples
    - Use Mermaid diagrams for module structure
    - Link to related files: `[ClassName](path/to/file.h)`
    - Explain relationships with other modules
    - Aim for 400-600 words

    # Output Format
    Generate a complete Markdown document with proper headings and formatting.

    Generate ONLY the markdown content, no additional commentary.

# ====================
# DETAILED-LEVEL AGENT PROMPTS
# ====================

detailed_level:
  # Class Documentation
  class: |
    Generate comprehensive API documentation for this C++ class.

    # Class Information
    **Name**: {class_name}
    **File**: {file_path}
    **Namespace**: {namespace}

    # Class Definition
    ```cpp
    {class_code}
    ```

    # Members
    {members}

    # Methods
    {methods}

    # Project Context
    {project_structure}

    # Your Task
    Create detailed API documentation for this class.

    ## Topics to Cover
    1. **Class Overview**: Purpose and responsibility (2-3 sentences)
    2. **Class Diagram**: Mermaid class diagram showing relationships
    3. **Constructor/Destructor**: How to create and destroy instances
    4. **Public Interface**:
       - Document each public method
       - Include parameters, return values, exceptions
       - Provide usage examples
    5. **Member Variables**: Document public/protected members
    6. **Usage Examples**: Real-world usage scenarios
    7. **Thread Safety**: Is this class thread-safe?
    8. **Performance Considerations**: Any performance notes
    9. **Best Practices**: Recommended usage patterns
    10. **Common Pitfalls**: Things to avoid

    ## Method Documentation Format
    For each method:
    ```markdown
    ### `methodName()`

    **Signature**: `ReturnType methodName(ParamType param)`

    **Description**: What this method does

    **Parameters**:
    - `param`: Description

    **Returns**: Description of return value

    **Throws**: Exceptions that may be thrown

    **Example**:
    ```cpp
    // Usage example
    MyClass obj;
    obj.methodName(value);
    ```
    ```

    ## Requirements
    - Be thorough and precise
    - Include code examples for complex APIs
    - Use Mermaid diagrams
    - Reference related classes
    - Highlight important details
    - Aim for 600-1000 words

    # Output Format
    Generate a complete Markdown document with proper headings and formatting.

    Generate ONLY the markdown content, no additional commentary.

  # Functions Documentation
  functions: |
    Generate comprehensive API documentation for these C++ functions.

    # File Information
    **File**: {file_path}
    **Namespace**: {namespace}

    # Functions
    {functions_list}

    # Project Context
    {project_structure}

    # Your Task
    Create detailed API documentation for these functions.

    ## Topics to Cover
    1. **File Overview**: Purpose of this file (2-3 sentences)
    2. **Functions Summary**: Table of all functions
    3. **Detailed Documentation**: For each function:
       - Purpose and behavior
       - Parameters with descriptions
       - Return value
       - Exceptions/error handling
       - Complexity (time/space)
       - Usage examples
       - Related functions

    ## Function Documentation Format
    For each function:
    ```markdown
    ### `functionName()`

    **Signature**: `ReturnType functionName(ParamType param)`

    **Description**: What this function does

    **Parameters**:
    - `param`: Description with type details

    **Returns**: Description of return value

    **Complexity**: O(n) time, O(1) space (if applicable)

    **Throws**: Exceptions that may be thrown

    **Example**:
    ```cpp
    // Usage example
    auto result = functionName(value);
    ```

    **See Also**: Related functions
    ```

    ## Requirements
    - Document each function thoroughly
    - Include practical examples
    - Mention edge cases
    - Note thread safety if relevant
    - Reference related functions
    - Aim for 400-800 words

    # Output Format
    Generate a complete Markdown document with proper headings and formatting.

    Generate ONLY the markdown content, no additional commentary.

# ====================
# CROSS-LINKER PROMPTS
# ====================

cross_linker:
  # Document Linking
  linking: |
    Analyze this document and suggest related documents that should be cross-referenced.

    # Current Document
    **Path**: {doc_path}
    **Content**:
    ```markdown
    {doc_content}
    ```

    # Candidate Related Documents
    {candidates}

    # Your Task
    Analyze the content and identify which of the candidate documents are truly relevant and should be linked.

    For each relevant document:
    1. Explain WHY it's related (1 sentence)
    2. Suggest WHERE in the current document to add the link
    3. Suggest link text

    ## Output Format
    Return a JSON array of recommendations:
    ```json
    [
      {
        "target_doc": "path/to/doc.md",
        "reason": "Why this doc is related",
        "link_text": "Suggested link text",
        "section": "Which section to add link to"
      }
    ]
    ```

    Only suggest documents that are genuinely relevant and useful to readers.
    Maximum 5 recommendations.

    Generate ONLY the JSON array, no additional commentary.

