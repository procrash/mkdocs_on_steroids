cross_linker:
  # Document Linking
  linking: |
    Analyze this document and suggest related documents that should be cross-referenced.

    # Current Document
    **Path**: {doc_path}
    **Content**:
    ```markdown
    {doc_content}
    ```

    # Candidate Related Documents
    {candidates}

    # Your Task
    Analyze the content and identify which of the candidate documents are truly relevant and should be linked.

    For each relevant document:
    1. Explain WHY it's related (1 sentence)
    2. Suggest WHERE in the current document to add the link
    3. Suggest link text

    ## Output Format
    Return a JSON array of recommendations:
    ```json
    [
      {
        "target_doc": "path/to/doc.md",
        "reason": "Why this doc is related",
        "link_text": "Suggested link text",
        "section": "Which section to add link to"
      }
    ]
    ```

    Only suggest documents that are genuinely relevant and useful to readers.
    Maximum 5 recommendations.

    Generate ONLY the JSON array, no additional commentary.

