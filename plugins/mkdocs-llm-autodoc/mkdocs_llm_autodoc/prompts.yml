high_level:
  # Getting Started Documentation
  getting_started: |
    Create a comprehensive "Getting Started" guide for this C++ project.

    # Project Structure
    {project_structure}

    # Your Task
    Write a beginner-friendly guide that helps developers get started with this project.

    ## Topics to Cover
    1. **Project Overview**: What is this project? What does it do?
    2. **Prerequisites**: Required tools, libraries, dependencies
    3. **Building the Project**: Step-by-step build instructions
    4. **First Steps**: How to run the project for the first time
    5. **Project Structure**: Overview of key directories and files
    6. **Entry Points**: Where to start reading the code ({entry_points})
    7. **Common Tasks**: Typical developer workflows
    8. **Next Steps**: Where to go from here

    ## Requirements
    - Write in clear, friendly language
    - Include practical examples and commands
    - Reference specific files with links: `[filename](path/to/file.cpp)`
    - Add code snippets where helpful
    - Use Mermaid diagrams for visual explanations
    - Aim for 500-700 words

    # Output Format
    Generate a complete Markdown document with proper headings and formatting.

    Generate ONLY the markdown content, no additional commentary.

  # Architecture Documentation
  architecture: |
    Act as a Chief Software Architect. Synthesize a "System Architecture Report" for this project.

    # Project Structure
    {project_structure}

    # Module Intelligence Reports (from mid-level analysis)
    The following are summaries of the modules in this system:

    {module_summaries}

    # Your Task
    Synthesize this information into a comprehensive Architecture Document.
    Focus on the "Big Picture" and how modules interact.

    ## 1. System Overview
    - **High-Level Goal**: What does this entire system do?
    - **Core Architecture**: Is it Layered? Microservices? Monolithic? Event-driven?

    ## 2. System Context (C4 Level 1)
    - Who uses this system?
    - What external systems does it interact with?

    ## 3. Container/Component Architecture (C4 Level 2)
    - How are the modules organized?
    - **Mermaid Diagram**: Create a system-level diagram showing MODULE relationships.
    ```mermaid
    graph TD
        %% Add module relationships based on the summaries
    ```

    ## 4. Cross-Cutting Concerns
    - **Error Handling Strategy**: How are errors propagated?
    - **Data Flow**: How does data move through the system?
    - **Security**: Authentication/Authorization patterns?

    # Output Format
    - Markdown with clear headings.
    - **Embed Mermaid diagrams**.
    - Be professional and architectural.

    Generate ONLY the markdown content, no additional commentary.

  # Filesystem Structure Documentation
  filesystem_structure: |
    Create comprehensive documentation of the project's filesystem structure.

    # Project Information
    **Project Root**: {project_root}
    **Total Files**: {total_files}
    **Total Directories**: {total_directories}

    # Directory Tree
    {directory_tree}

    # File Statistics by Type
    {file_statistics}

    # Key Directories
    {key_directories}

    # Your Task
    Create clear, navigable documentation of this project's filesystem organization.

    ## Topics to Cover
    1. **Directory Structure Overview**:
       - Main directories and their purpose
       - Organization strategy (by feature, by layer, etc.)
       - Special directories (build, docs, tests, etc.)

    2. **Source Code Organization**:
       - Where to find different types of code
       - Header files location
       - Implementation files location
       - How files are grouped

    3. **Key Directories Explained**:
       - For each major directory, explain:
         - What it contains
         - Why it's organized this way
         - Key files within it
         - Subdirectory structure

    4. **File Naming Conventions**:
       - Header file patterns (*.h, *.hpp)
       - Implementation patterns (*.cpp, *.cc)
       - Any special naming rules

    5. **Build System Files**:
       - Location of CMakeLists.txt or build files
       - Configuration files
       - Build output directories

    6. **Documentation & Resources**:
       - Where documentation is stored
       - README locations
       - Examples and samples

    7. **Testing Structure**:
       - Test file locations
       - Test organization strategy

    8. **Navigation Guide**:
       - Quick reference: "Where do I find X?"
       - Common tasks and file locations
       - Entry points for new developers

    ## Requirements
    - Use ASCII tree diagrams for structure visualization
    - Create a table of key directories with descriptions
    - Include file counts per directory
    - Provide clear navigation paths
    - Use Mermaid diagrams for directory hierarchy if helpful
    - Make it easy for new developers to understand the layout
    - Reference actual directory and file names
    - Aim for 600-800 words

    ## Example Structure

    # Project Filesystem Structure

    ## Directory Overview

    ```
    project-root/
    ├── src/           # Source code (120 files)
    ├── include/       # Header files (80 files)
    ├── tests/         # Unit tests (45 files)
    ├── docs/          # Documentation (25 files)
    ├── build/         # Build output (excluded from docs)
    └── CMakeLists.txt # Build configuration
    ```

    ## Key Directories

    | Directory | Purpose | Key Files | File Count |
    |-----------|---------|-----------|------------|
    | `src/` | Main source code | `main.cpp`, ... | 120 |
    | ... | ... | ... | ... |

    ## Navigation Guide

    - **Looking for the entry point?** → `src/main.cpp`
    - **Need to add a new class?** → `include/` for header, `src/` for implementation
    - **Want to run tests?** → `tests/` directory
    - **Build the project?** → See `CMakeLists.txt` in root

    # Output Format
    - Use clear, hierarchical structure
    - Include actual directory tree (ASCII art)
    - Create easy-to-scan tables
    - Add quick navigation references
    - Use code blocks for directory paths
    - Keep it practical and developer-focused

    Generate ONLY the markdown content, no additional commentary.

